name: Publish website

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-website.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run website:build
        env:
          VITE_SITE_BASE: /Virgues-Roblox-Account-Manager/
          VITE_NEON_AUTH_URL: ${{ vars.NEON_AUTH_URL }}
          VITE_VIRGUE_BILLING_API_URL: ${{ vars.VIRGUE_BILLING_API_URL }}
          VITE_VIRGUE_DOWNLOAD_URL: ${{ vars.VIRGUE_DOWNLOAD_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
